<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samir GMR999 - Gaming & Entertainment</title>
    <!-- FontAwesome for Social Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f1016;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: #1a1c29;
            border: 2px solid #00f3ff;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            width: 350px;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
        }

        .logo-container {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #ff007f;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.6);
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #00f3ff;
            text-shadow: 0 0 5px rgba(0, 243, 255, 0.5);
        }

        p {
            font-size: 14px;
            color: #b3b3b3;
            margin-bottom: 25px;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .social-icons a {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 45px;
            height: 45px;
            background: #252839;
            border-radius: 50%;
            color: #ffffff;
            font-size: 20px;
            text-decoration: none;
            transition: 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .social-icons a.youtube:hover {
            background: #ff0000;
            box-shadow: 0 0 10px #ff0000;
            border-color: #ff0000;
        }

        .social-icons a.instagram:hover {
            background: radial-gradient(circle at 30% 107%, #fdf497 0%, #df5914 45%, #c62435 60%, #515ec4 90%);
            box-shadow: 0 0 10px #df5914;
            border-color: #df5914;
        }

        .social-icons a.facebook:hover {
            background: #1877f2;
            box-shadow: 0 0 10px #1877f2;
            border-color: #1877f2;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Logo / Photo Section -->
        <div class="logo-container">
            <img src="1000138167.png" alt="Samir GMR999 Logo[span_1](start_span)"[span_1](end_span)>
        </div>

        <h1>Samir GMR999</h1>
        <p>Gaming & Entertainment</p>

        <!-- Social Media Links -->
        <div class="social-icons">
            <!-- YouTube Link -->
            <a href="https://youtube.com/@samir_gmr999?si=I21gmkZ89jDxpe5l" target="_blank" class="youtube" title="YouTube">
                <i class="fa-brands fa-youtube"></i>
            </a>

            <!-- Instagram Link -->
            <a href="https://www.instagram.com/samir_gmr999?stkn=MXBhZ2JoOGRpMXFybQ==" target="_blank" class="instagram" title="Instagram">
                <i class="fa-brands fa-instagram"></i>
            </a>

            <!-- Facebook Link (Gmail replaced) -->
            <a href="https://www.facebook.com/share/1GxTZtirAA/" target="_blank" class="facebook" title="Facebook">
                <i class="fa-brands fa-facebook-f"></i>
            </a>
        </div>
    </div>

</body>
</html>
